name: Foundation validation

on:
  push:
    branches:
      - feature/**
      - bug/**
      - chore/**
      - docs/**
  pull_request:
    branches: [rc, main]
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      APP_ENV: development
      WEB_LOGIN_ENABLED: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/verify-foundation.mjs
      - run: npm ci
      - run: npm run contract:check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  ci-gate:
    if: github.event_name == 'pull_request' && always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_RESULT: ${{ needs.validate.result }}
    steps:
      - run: test "$VALIDATION_RESULT" = success

  push-gate:
    if: github.event_name == 'push' && always()
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      VALIDATION_RESULT: ${{ needs.validate.result }}
    steps:
      - run: test "$VALIDATION_RESULT" = success
