    - heading "A slower look" [level=2]
    - paragraph: Curiosity does not need a grand expedition. Sometimes it starts with an ordinary walk, a familiar street, and a little time to notice what has changed. This synthetic story is written for reading-interface verification, with enough content to inspect measure, rhythm, and responsive reflow.
    - heading "Notice the details" [level=3]
    - paragraph:
      - text: A reader should be able to settle into a line of text without losing their place.
      - strong: A clear emphasis
      - text: ", a gentle"
      - emphasis: change of voice
      - text: ", and an inline"
      - code: observation.note
      - text: "all have useful roles. Unicode belongs here too: café, naïve, 日本語, and a small 🌱."
    - blockquote:
      - paragraph: Attention is a practice. Make a little room for something you have not noticed before.
    - heading "Keep the hierarchy" [level=4]
    - list:
      - listitem:
        - text: Begin with what is nearby.
        - list:
          - listitem: Observe a shape, a sound, or a color.
          - listitem:
            - text: Ask one question about it.
            - list:
              - listitem: Make the question specific.
      - listitem: Write down the detail you want to remember.
    - heading "A landscape to pause with" [level=3]
    - paragraph:
      - img "A synthetic green landscape with a warm sun"
    - paragraph: The illustration above is a local, deterministic test asset. It lets us verify image dimensions, alternative text, loading failures, and a layout that remains stable while reading. This paragraph should remain comfortable on a wide display and reflow into a single column at phone width.
